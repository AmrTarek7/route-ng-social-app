<main class="mx-auto max-w-7xl px-3 py-3.5">
  <section class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]">
            <svg lucideKeyRound [size]="18"></svg>
          </span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">Keep your account secure by using a strong password.</p>
          </div>
        </div>
        <form [formGroup]="changePasswordForm" (ngSubmit)="submitChangePassword()" class="space-y-4">
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
            <input
              placeholder="Enter current password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="currentPassword"
            />

            @if (changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched && changePasswordForm.get('currentPassword')?.dirty) {
              @if (changePasswordForm.get('currentPassword')?.hasError('required')) {
                <p class="mt-1 text-xs font-semibold text-rose-600">Current password is required.</p>
              } @else if (changePasswordForm.get('currentPassword')?.hasError('pattern')) {
                <p class="mt-1 text-xs font-semibold text-rose-600">At least 8 characters and contain at least one uppercase letter, one lowercase letter, one number, and one special character (@$!%*?&)..</p>
              }
            }
          </label>
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
            <input
              placeholder="Enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="newPassword"
            />
            @if (changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.dirty) {
              @if (changePasswordForm.get('newPassword')?.hasError('required')) {
                <p class="mt-1 text-xs font-semibold text-rose-600">New password is required.</p>
              } @else if (changePasswordForm.get('newPassword')?.hasError('pattern')) {
                <p class="mt-1 text-xs font-semibold text-rose-600">At least 8 characters and contain at least one uppercase letter, one lowercase letter, one number, and one special character (@$!%*?&)..</p>
              }
            }
          </label>
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span>
            <input
              placeholder="Re-enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              formControlName="confirmNewPassword"
            />

            @if (changePasswordForm.get('confirmNewPassword')?.touched && changePasswordForm.get('confirmNewPassword')?.dirty) {
              @if (changePasswordForm.get('confirmNewPassword')?.invalid) {
                <!--  -->
                @if (changePasswordForm.get('confirmNewPassword')?.hasError('required')) {
                  <p class="mt-1 text-xs font-semibold text-rose-600">Please confirm your new password.</p>
                } @else if (changePasswordForm.get('confirmNewPassword')?.hasError('pattern')) {
                  <p class="mt-1 text-xs font-semibold text-rose-600">- At least 8 characters and contain at least one uppercase letter, one lowercase letter, one number, and one special character (@$!%*?&)..</p>
                }
              }
            }
            @if (changePasswordForm.getError('passwordsDoNotMatch') && changePasswordForm.get('confirmNewPassword')?.touched && !changePasswordForm.get('confirmNewPassword')?.hasError('required')) {
              <p class="mt-3 text-xs font-semibold text-rose-600">- Passwords do not match.</p>
            }
          </label>

          @if (errorMsg()) {
            <p class="mt-1 rounded-xl bg-red-600 px-4 py-2 text-center text-sm font-semibold text-white">{{ errorMsg() }}</p>
          }

          @if (successMsg()) {
            <p class="mt-1 rounded-xl bg-green-600 px-4 py-2 text-center text-sm font-semibold text-white">{{ successMsg() }}</p>
          }

          <button
            type="submit"
            [disabled]="changePasswordForm.invalid || loading()"
            class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60"
          >
            Update password
          </button>
        </form>
      </section>
    </div>
  </section>
</main>
