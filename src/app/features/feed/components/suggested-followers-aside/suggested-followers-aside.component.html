<aside class="hidden h-fit xl:sticky xl:top-21 xl:block">
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="mb-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <svg lucideUsers class="text-[#1877f2]" size="18"></svg>
        <h3 class="text-base font-extrabold text-slate-900">Suggested Friends</h3>
      </div>
      <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">5</span>
    </div>
    <div class="mb-3">
      <label class="relative block">
        <svg lucideSearch [size]="15" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></svg>
        <input placeholder="Search friends..." class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 outline-none focus:border-[#1877f2] focus:bg-white" value="" />
      </label>
    </div>

    <!-- suggested users card -->
    <div class="space-y-3">
      <div class="rounded-xl border border-slate-200 p-2.5">
        <div class="flex items-center justify-between gap-2">
          <button type="button" class="flex min-w-0 items-center gap-2 rounded-lg px-1 py-1 text-left transition hover:bg-slate-50">
            <img alt="abdalla" class="h-10 w-10 rounded-full object-cover" src="https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png" />
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-slate-900 hover:underline">abdalla</p>
              <p class="truncate text-xs text-slate-500">@abdalla333</p>
            </div>
          </button>
          <button class="inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-xs font-bold transition disabled:opacity-60 bg-[#e7f3ff] text-[#1877f2] hover:bg-[#d8ebff]">
            <svg lucideUserPlus [size]="13"></svg>
            Follow
          </button>
        </div>
        <div class="mt-2 flex items-center gap-2 text-[11px] font-semibold text-slate-500">
          <span class="rounded-full bg-slate-100 px-2 py-0.5">41 followers</span>
        </div>
      </div>
    </div>
    <button class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100">View more</button>
  </div>
</aside>
