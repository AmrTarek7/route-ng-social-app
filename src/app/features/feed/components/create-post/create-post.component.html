<form (submit)="submitForm($event)" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
  <div class="mb-3 flex items-start gap-3">
    <img [alt]="userData().name" class="h-11 w-11 rounded-full object-cover" [src]="userData().photo || 'https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png'" />
    <div class="flex-1">
      <p class="text-base font-bold text-slate-900">{{ userData().name || 'You' }}</p>
      <div class="inline-flex items-center gap-1.5 rounded-full bg-slate-100/80 ps-3 py-1 text-xs! font-medium text-slate-700">
        <!-- أيقونة الكرة الأرضية -->
        <i class="fa-solid fa-earth-americas text-slate-500"></i>

        <!-- عنصر الاختيار select -->
        <select [formControl]="privacy" class="appearance-none bg-transparent border-0 pr-7 pl-1 text-xs py-1 font-medium outline-none cursor-pointer focus:ring-0">
          <option value="public">Public</option>
          <option value="following">Followers</option>
          <option value="only_me">Only me</option>
        </select>
      </div>
    </div>
  </div>
  <div class="relative">
    <textarea
      rows="4"
      [placeholder]="`What's on your mind, ${userData().name || 'You'}?`"
      [formControl]="content"
      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-[17px] leading-relaxed text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
    ></textarea>
  </div>
  @if (imageUrl()) {
    <div class="relative">
      <button type="button" (click)="removeImage(fileUploadInput)" class="absolute top-2 right-2 z-10 size-9 rounded-full bg-black/80 text-white transition duration-200 hover:bg-black/60 hover:scale-110 active:scale-90 text-sm">
        <i class="fa-solid fa-close"></i>
      </button>

      <img [src]="imageUrl()" alt="Preview" class="max-h-60 w-full rounded-lg object-cover" />
    </div>
  }
  <div class="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-border pt-3">
    <div class="relative flex items-center gap-2">
      <label class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100">
        <i class="fa-regular fa-images text-emerald-600"></i>
        <span class="hidden sm:inline">Photo/video</span>
        <input #fileUploadInput (change)="changeImageInput($event)" accept="image/*" class="hidden" type="file" />
      </label>
      <button type="button" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100">
        <svg lucideFaceSlightlySmiling class="text-amber-600" title="Home" [size]="20"></svg>
        <span class="hidden sm:inline">Feeling/activity</span>
      </button>
    </div>
    <div class="flex items-center gap-3">
      <button [disabled]="!saveFile() && !content.value" class="flex items-center gap-2 rounded-md bg-[#1877f2] px-5 py-2 text-sm font-bold text-white shadow-sm transition-colors hover:bg-[#166fe5] disabled:opacity-60">
        Post

        <i class="fa-regular fa-paper-plane font-normal"></i>
      </button>
    </div>
  </div>
</form>
