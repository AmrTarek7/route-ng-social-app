<aside class="hidden h-fit space-y-3 xl:sticky xl:top-21 xl:block">
  <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
    <button class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition bg-[#e7f3ff] text-[#1877f2]">
      <svg lucideNewspaper [size]="17"></svg>
      Feed
    </button>

    <button class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition text-slate-700 hover:bg-slate-100">
      <svg lucideSparkle [size]="17"></svg>
      My Posts
    </button>

    <button class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition text-slate-700 hover:bg-slate-100">
      <svg lucideEarth [size]="17"></svg>
      Community
    </button>

    <button class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition text-slate-700 hover:bg-slate-100">
      <svg lucideBookmark [size]="17"></svg>
      Saved
    </button>
  </div>
</aside>
