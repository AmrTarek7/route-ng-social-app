<aside class="hidden h-fit space-y-3 xl:sticky xl:top-21 xl:block">
  <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
    <button
      [ngClass]="type() === 'following' ? 'bg-[#e7f3ff] text-[#1877f2]' : 'text-slate-700 hover:bg-slate-100'"
      (click)="getAllPosts('following')"
      class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition"
    >
      <svg lucideNewspaper [size]="17"></svg>
      Feed
    </button>

    <button (click)="getAllPosts('me')" [ngClass]="type() === 'me' ? 'bg-[#e7f3ff] text-[#1877f2]' : 'text-slate-700 hover:bg-slate-100'" class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition">
      <svg lucideSparkle [size]="17"></svg>
      My Posts
    </button>

    <button (click)="getAllPosts('all')" [ngClass]="type() === 'all' ? 'bg-[#e7f3ff] text-[#1877f2]' : 'text-slate-700 hover:bg-slate-100'" class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm font-bold transition">
      <svg lucideEarth [size]="17"></svg>
      Community
    </button>

    <button (click)="getAllPosts('saved')" [ngClass]="type() === 'saved' ? 'bg-[#e7f3ff] text-[#1877f2]' : 'text-slate-700 hover:bg-slate-100'" class="mt-1 flex w-full items-center gap-3 rounded-base px-3 py-2 text-left text-sm font-bold transition">
      <svg lucideBookmark [size]="17"></svg>
      Saved
    </button>
  </div>
</aside>
