<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="space-y-4">
      <button (click)="goBack()" class="inline-flex items-center gap-2 rounded-md border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left" aria-hidden="true">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path></svg
        >Back
      </button>

      @if (!loading()) {
        <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
          <div [ngStyle]="coverStyle()" class="h-48 bg-[linear-gradient(112deg,#0f172a_0%,#1e3a5f_36%,#2b5178_72%,#5f8fb8_100%)]"></div>

          <div class="relative -mt-14 px-3 pb-5 sm:px-5">
            <div class="flex flex-wrap items-end justify-between gap-4 rounded-2xl border border-white/70 bg-white/95 p-4">
              <div class="flex items-end gap-3">
                <img [alt]="profileInfo().name || ''" class="h-20 w-20 rounded-full border-4 border-white object-cover shadow-sm sm:h-24 sm:w-24" [src]="profileInfo().photo" />
                <div>
                  <p class="text-xl font-black text-slate-900 sm:text-2xl">{{ profileInfo().name }}</p>
                  <p class="text-sm font-semibold text-slate-500 sm:text-base">@{{ profileInfo().username }}</p>
                </div>
              </div>
              @if (isFollowing()) {
                <button
                  [disabled]="loadingFollowResponse()"
                  (click)="followAndUnfollow()"
                  type="button"
                  class="inline-flex w-full items-center justify-center gap-2 rounded-md px-4 py-2 text-sm font-extrabold transition sm:w-auto border border-slate-300 bg-white text-slate-700 hover:bg-slate-100"
                >
                  <svg lucideCheck size="16"></svg>

                  {{ !loadingFollowResponse() ? 'Following' : 'Updating...' }}
                </button>
              } @else {
                <button
                  (click)="followAndUnfollow()"
                  [disabled]="loadingFollowResponse()"
                  type="button"
                  class="inline-flex w-full items-center justify-center gap-2 rounded-md px-4 py-2 text-sm font-extrabold transition sm:w-auto bg-[#1877f2] text-white hover:bg-[#166fe5]"
                >
                  <svg lucideUserPlus size="16"></svg>

                  {{ !loadingFollowResponse() ? 'Follow' : 'Updating...' }}
                </button>
              }
            </div>
          </div>
        </section>
      } @else {
        <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm animate-pulse">
          <!-- Cover Skeleton -->
          <div class="h-48 bg-slate-200"></div>

          <div class="relative -mt-14 px-3 pb-5 sm:px-5">
            <div class="flex flex-wrap items-end justify-between gap-4 rounded-2xl border border-slate-200 bg-white p-4">
              <!-- Profile Info -->
              <div class="flex items-end gap-3">
                <!-- Avatar Skeleton -->
                <div class="h-20 w-20 shrink-0 rounded-full border-4 border-white bg-slate-300 shadow-sm sm:h-24 sm:w-24"></div>

                <!-- Name & Username Skeleton -->
                <div class="space-y-2 pb-1">
                  <div class="h-6 w-36 rounded-md bg-slate-300 sm:h-7 sm:w-44"></div>
                  <div class="h-4 w-28 rounded-md bg-slate-200 sm:w-32"></div>
                </div>
              </div>

              <!-- Following Button Skeleton -->
              <div class="h-10 w-full rounded-md bg-slate-200 sm:w-32"></div>
            </div>
          </div>
        </section>
      }

      <section class="space-y-3">
        @for (post of userPostsList(); track post._id) {
          <app-post [post]="post" />
        } @empty {
          <app-skeleton-post />
        }
      </section>
    </div>
  </main>
</div>
