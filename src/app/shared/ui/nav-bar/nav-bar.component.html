<header class="sticky top-0 z-40 border-b border-slate-200/90 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-2 py-1.5 sm:gap-3 sm:px-3">
    <div class="flex items-center gap-3">
      <!-- <img alt="Route Posts" class="h-9 w-9 rounded-xl object-cover" src="/route.png" /> -->
      <p class="hidden text-xl font-bold text-slate-900 sm:block">Route Posts</p>
    </div>
    <nav class="flex min-w-0 items-center gap-1 overflow-x-auto rounded-2xl border border-slate-200 bg-slate-50/90 px-1 py-1 sm:px-1.5">
      <a routerLinkActive="bg-white text-[#1f6fe5]!" class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-bold transition sm:gap-2 sm:px-3.5 text-slate-600 hover:bg-white/90 hover:text-slate-900" routerLink="/feed">
        <span class="relative fa-regular fa-house text-lg"> </span>
        <span class="hidden sm:inline">Feed</span>
        <span class="sr-only sm:hidden">Feed</span>
      </a>
      <a routerLinkActive="bg-white text-[#1f6fe5]!" class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-bold transition sm:gap-2 sm:px-3.5 text-slate-600 hover:bg-white/90 hover:text-slate-900" routerLink="/profile">
        <span class="relative fa-regular fa-user text-lg"> </span>
        <span class="hidden sm:inline">Profile</span>
        <span class="sr-only sm:hidden">Profile</span>
      </a>
      <a routerLinkActive="bg-white text-[#1f6fe5]!" class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-bold transition sm:gap-2 sm:px-3.5 text-slate-600 hover:bg-white/90 hover:text-slate-900" routerLink="/notifications">
        <span class="relative fa-regular fa-comment text-lg"></span>
        <span class="hidden sm:inline">Notifications</span>
        <span class="sr-only sm:hidden">Notifications</span>
      </a>
    </nav>
    <div class="relative">
      <button (click)="toggleUserMenu(navUserMenu)" class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5 transition hover:bg-slate-100">
        <img [alt]="user()?.name" class="h-8 w-8 rounded-full object-cover" [src]="user()?.photo" />
        <span class="hidden max-w-35 truncate text-sm font-semibold text-slate-800 md:block">{{ user()?.name }}</span>
        <i class="fa-solid fa-bars text-slate-500 text-sm"></i>
      </button>

      <div #navUserMenu class="hidden absolute right-0 z-50 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-lg">
        <button (click)="toggleUserMenu(navUserMenu)" routerLink="/profile" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
          <i class="fa-regular fa-user text-slate-600"></i>
          Profile
        </button>
        <button (click)="toggleUserMenu(navUserMenu)" routerLink="/settings" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
          <i class="fa-solid fa-gear text-slate-600"></i>
          Settings
        </button>
        <div class="my-1 border-t border-slate-200"></div>
        <button (click)="toggleUserMenu(navUserMenu)" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-semibold text-rose-600 hover:bg-rose-50">Logout</button>
      </div>
    </div>
  </div>
</header>
