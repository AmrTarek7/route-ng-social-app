<form (submit)="submitForm($event)" class="mt-3">
  @if (content.hasError('minlength') && content.touched && content.dirty) {
    <div class="my-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700">{{ isReply() ? 'Reply' : 'Comment' }} must be at least 2 characters.</div>
  }

  <div class="flex items-start gap-2">
    <img [alt]="userData()?.name || 'User'" [class]="isReply() ? 'mt-0.5 h-7 w-7 shrink-0 rounded-full object-cover' : 'h-9 w-9 shrink-0 rounded-full object-cover'" [src]="userData()?.photo || defaultAvatar" />
    <div class="w-full rounded-2xl border border-slate-200 bg-second-color px-2.5 py-1.5 focus-within:border-[#c7dafc] focus-within:bg-white">
      <textarea
        [formControl]="content"
        [placeholder]="placeholderText()"
        rows="1"
        class="h-10 max-h-35 min-h-10 w-full resize-none border-0 bg-transparent px-2 py-1.5 text-sm leading-5 outline-none placeholder:text-slate-500 focus:ring-0"
      ></textarea>
      <div class="mt-1 flex items-center justify-between">
        <div class="flex items-center gap-1">
          <label class="inline-flex cursor-pointer items-center justify-center rounded-full p-2 text-slate-500 transition hover:bg-slate-200 hover:text-emerald-600">
            <svg lucideImage size="18"></svg>
            <input accept="image/*" (change)="changeImageInput($event)" #fileUploadInput class="hidden" type="file" />
          </label>
          <button type="button" class="inline-flex items-center justify-center rounded-full p-2 text-slate-500 transition hover:bg-slate-200 hover:text-amber-500">
            <svg lucideFaceSlightlySmiling size="18"></svg>
          </button>
        </div>
        <button
          type="submit"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#1877f2] text-white shadow-sm transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:bg-[#9ec5ff] disabled:opacity-100"
          [disabled]="isSubmitDisabled()"
        >
          @if (sendLoading()) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
          } @else {
            <svg lucideSendHorizontal size="16"></svg>
          }
        </button>
      </div>
    </div>
  </div>

  @if (imageUrl()) {
    <div class="relative mt-2">
      <img alt="Preview" class="max-h-52 w-full rounded-lg object-cover" [src]="imageUrl()" />
      <button (click)="removeImage()" type="button" class="absolute right-2 top-2 rounded-full bg-black/60 p-1 text-white">
        <svg lucideX size="14"></svg>
      </button>
    </div>
  }
</form>
