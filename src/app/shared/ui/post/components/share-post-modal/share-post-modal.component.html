<div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
  <h4 class="text-base font-extrabold text-slate-900">Share post</h4>
  <button [disabled]="disableBtns()" (click)="closeShareModal()" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 disabled:opacity-60">
    <svg lucideX [size]="16"></svg>
  </button>
</div>
<div class="space-y-3 p-4">
  <form id="sharePostForm" (submit)="submitSharePost($event)">
    <textarea
      placeholder="Say something about this..."
      rows="3"
      maxlength="500"
      [formControl]="content"
      class="w-full resize-none rounded-xl border border-slate-300 px-3 py-2 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:ring-2 focus:ring-[#1877f2]/20"
    ></textarea>
  </form>
  @if (post()) {
    <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
      <div class="flex items-center gap-2">
        <img [alt]="post().user.name" class="h-8 w-8 rounded-full object-cover" [src]="post().user.photo" />
        <div class="min-w-0">
          <p class="truncate text-sm font-bold text-slate-900">{{ post().user.name }}</p>
          <p class="truncate text-xs font-semibold text-slate-500">{{ '@' + post().user.username }}</p>
        </div>
      </div>
      <p class="mt-2 whitespace-pre-wrap text-sm text-slate-800">{{ post().body }}</p>
      @if (post().image) {
        <img alt="post preview" class="mt-2 max-h-55 w-full rounded-lg object-cover" [src]="post().image" />
      }
    </div>
  }
</div>
<div class="flex items-center justify-end gap-2 border-t border-slate-200 px-4 py-3">
  <button [disabled]="disableBtns()" (click)="closeShareModal()" type="button" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100 disabled:opacity-60">Cancel</button>
  <button form="sharePostForm" type="submit" [disabled]="disableBtns()" class="inline-flex items-center rounded-md bg-[#1877f2] px-4 py-2 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60">
    {{ shareBtnText() }}
  </button>
</div>
