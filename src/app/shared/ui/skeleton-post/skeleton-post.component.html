@for (item of [1, 2, 3]; track item) {
  <div class="bg-white border border-gray-200 rounded-xl shadow-xs p-4 animate-pulse space-y-4">
    <!-- Header Skeleton -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gray-200 rounded-full"></div>
      <div class="space-y-1.5 flex-1">
        <div class="h-3.5 bg-gray-200 rounded w-1/4"></div>
        <div class="h-2.5 bg-gray-200 rounded w-1/6"></div>
      </div>
    </div>
    <!-- Body Skeleton -->
    <div class="space-y-2">
      <div class="h-3 bg-gray-200 rounded w-3/4"></div>
      <div class="h-3 bg-gray-200 rounded w-1/2"></div>
    </div>
    <!-- Media Skeleton -->
    <div class="h-64 bg-gray-200 rounded-lg w-full"></div>
  </div>
}
